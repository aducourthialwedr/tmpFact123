[project]
name = "reconciliation-poc"
version = "0.2.0"
description = "POC — moteur de rapprochement automatique paiements / factures"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
    "PyYAML>=6",
    "pydantic>=2.6",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "ipykernel>=6", "altair>=5"]
ui = ["streamlit>=1.45", "altair>=5"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
